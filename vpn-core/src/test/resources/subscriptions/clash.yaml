mixed-port: 7890
mode: rule
proxies:
  - {name: "SS obfs", type: ss, server: ss1.example.com, port: 8388, cipher: aes-256-gcm, password: pass123, plugin: obfs, plugin-opts: {mode: tls, host: bing.com}}
  - name: "SS v2ray 🚀"
    type: ss
    server: ss2.example.com
    port: "443"
    cipher: chacha20-ietf-poly1305
    password: pass123
    plugin: v2ray-plugin
    plugin-opts:
      mode: websocket
      tls: true
      host: ss2.example.com
      path: /ws
  - name: "SS kcptun"
    type: ss
    server: ss3.example.com
    port: 8388
    cipher: aes-128-gcm
    password: pass123
    plugin: kcptun
  - name: VMess WS
    type: vmess
    server: vm.example.com
    port: 443
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    alterId: 0
    cipher: auto
    tls: true
    servername: vm.example.com
    skip-cert-verify: true
    network: ws
    ws-opts:
      path: /vm
      headers:
        Host: cdn.example.com
  - name: VLESS Reality
    type: vless
    server: re.example.com
    port: 443
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    flow: xtls-rprx-vision
    network: tcp
    tls: true
    servername: www.example.org
    client-fingerprint: firefox
    reality-opts:
      public-key: PUBKEY123
      short-id: ab12
  - name: VLESS gRPC
    type: vless
    server: gr.example.com
    port: 443
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    network: grpc
    tls: true
    alpn: [h2]
    grpc-opts:
      grpc-service-name: svc
  - name: VLESS H2
    type: vless
    server: h2.example.com
    port: 443
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    network: h2
    tls: true
    h2-opts:
      host: [h2.example.com]
      path: /h2
  - name: VLESS HTTP
    type: vless
    server: ht.example.com
    port: 80
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    network: http
    http-opts:
      method: GET
      path: ["/a"]
      headers:
        Host: ["ht.example.com"]
  - name: VLESS XHTTP
    type: vless
    server: xh.example.com
    port: 443
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    network: xhttp
    tls: true
  - name: Trojan WS
    type: trojan
    server: tr.example.com
    port: 443
    password: pass123
    sni: tr.example.com
    network: ws
    ws-opts: {path: /t, v2ray-http-upgrade: true}
  - name: Hy2
    type: hysteria2
    server: hy.example.com
    port: 8443
    password: hy2pass
    up: "50 Mbps"
    down: 200
    obfs: salamander
    obfs-password: obfspw
    sni: hy.example.com
  - name: Hysteria1
    type: hysteria
    server: h1.example.com
    port: 8443
    auth-str: authpass
    up: 30
    down: 100
    alpn: [h3]
    sni: h1.example.com
  - name: TUIC
    type: tuic
    server: tu.example.com
    port: 443
    uuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    password: tuicpw
    congestion-controller: bbr
    udp-relay-mode: native
    alpn: [h3]
  - name: WG
    type: wireguard
    server: wg.example.com
    port: 51820
    ip: 10.0.0.2
    ipv6: fd00::2
    private-key: cHJpdmF0ZWtleXByaXZhdGVrZXlwcml2YXRla2V5MTI=
    public-key: cHVibGlja2V5cHVibGlja2V5cHVibGlja2V5cHVibGk=
    reserved: [1, 2, 3]
    mtu: 1280
  - name: SOCKS
    type: socks5
    server: so.example.com
    port: 1080
    username: bob
    password: secret
  - name: HTTP TLS
    type: http
    server: hp.example.com
    port: 443
    username: bob
    password: secret
    tls: true
    sni: hp.example.com
  - name: AnyTLS
    type: anytls
    server: an.example.com
    port: 443
    password: anypw
    sni: an.example.com
  - name: SSH
    type: ssh
    server: sh.example.com
    port: 22
    username: root
    password: sshpw
  - name: SSR old
    type: ssr
    server: sr.example.com
    port: 443
    cipher: aes-256-cfb
    password: x
    protocol: origin
    obfs: plain
proxy-groups:
  - name: Auto
    type: url-test
    proxies: ["SS obfs", "VMess WS"]
rules:
  - MATCH,Auto
