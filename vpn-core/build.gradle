plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

android {
    namespace 'com.telegram.vpncore'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    testOptions {
        // Parsing code only touches android.util.Log; make it a no-op instead of throwing
        // "not mocked" so the parsers can be tested on a plain JVM.
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // sing-box — локальный AAR (libs/libbox.aar)
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // Encrypted storage for VPN configs
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Clash / Mihomo YAML subscriptions (parsed with SafeConstructor only)
    implementation "org.yaml:snakeyaml:2.7"

    // Core
    implementation "androidx.core:core-ktx:1.13.1"

    // Pure-JVM unit tests. Android's org.json is a stub there, so bring the real one.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20231013"
}
